# BoT-SORT config tuned for stable long-term person tracking
# At 24 fps: track_buffer=120 → 5 s grace before a lost track is dropped

tracker_type: botsort

# Detection thresholds
track_high_thresh: 0.35     # must be >= CONF_THRESHOLD in track_video.py
track_low_thresh: 0.10      # still accept low-score detections in 2nd-stage match
new_track_thresh: 0.50      # only birth a brand-new ID for confident, unmatched detections

# Keep a lost track alive for 120 frames (~5 s at 24 fps) before discarding
track_buffer: 120

# Association cost threshold — lower = accept weaker IoU matches (helps after brief occlusion)
match_thresh: 0.70

fuse_score: True

# Global motion compensation (helps if camera pans/tilts)
gmc_method: sparseOptFlow

# ReID — appearance features to re-associate the same person after longer absences
proximity_thresh: 0.30      # allow ReID even when IoU overlap is small
appearance_thresh: 0.75     # cosine similarity threshold for appearance match
with_reid: True             # download + use a lightweight ReID model
model: auto                 # use detector backbone features; no separate download needed
